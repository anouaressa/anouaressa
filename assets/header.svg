  <text x="104" y="192" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">Cloud &amp; SRE· Morocco</text>
  <text x="104" y="232" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Reliable platforms. Calm operations. Better automation.</text>
